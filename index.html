<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현장 점검 타임마크</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 15px; background: #1e1e1e; color: #fff; }
    h2 { margin-top: 0; font-size: 18px; color: #4CAF50; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 13px; color: #bbb; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; font-size: 15px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-gps { background: #2196F3; color: white; }
    .btn-cam { background: #4CAF50; color: white; }
    #status { font-size: 13px; color: #ffeb3b; margin: 10px 0; line-height: 1.5; white-space: pre-line; }
    canvas { width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #555; display: none; }
    .btn-save { background: #ff9800; color: #000; width: 100%; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <h2>📷 현장 조사 기록기</h2>

  <div id="status">⏳ GPS 위치 및 주소를 불러오는 중...</div>

  <div class="form-group">
    <label>제목 (상단 강조 표시)</label>
    <input type="text" id="titleText" value="일제점검(북부)" placeholder="예: 일제점검(북부)">
  </div>

  <div class="form-group">
    <label>세부위치</label>
    <input type="text" id="detailLoc" placeholder="예: 팔거천 우안17번">
  </div>

  <div class="form-group">
    <label>내용</label>
    <input type="text" id="content" placeholder="예: 일제점검">
  </div>

  <div class="form-group">
    <label>점검자</label>
    <input type="text" id="inspector" value="김민석">
  </div>

  <div class="btn-group">
    <button class="btn-gps" onclick="getLocation()">🔄 GPS 재검색</button>
    <button class="btn-cam" onclick="document.getElementById('cameraInput').click()">📸 사진 촬영</button>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="processImage(event)">

  <canvas id="canvas"></canvas>
  <button id="saveBtn" class="btn-save" onclick="downloadImage()">💾 갤러리에 사진 저장</button>

  <script>
    const VWORLD_KEY = "8C6FFDBC-080D-441A-B2FD-3FA46A1D5588";
    let currentLat = "측정중";
    let currentLng = "측정중";
    let currentAddress = "주소 변환 대기중...";

    window.onload = getLocation;

    function getLocation() {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "⏳ GPS 수신 중... (실외에서 정확도가 높습니다)";

      if (!navigator.geolocation) {
        statusEl.innerText = "❌ 이 브라우저는 GPS를 지원하지 않습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude.toFixed(6);
          currentLng = pos.coords.longitude.toFixed(6);
          const acc = Math.round(pos.coords.accuracy);
          statusEl.innerText = `✅ GPS 수신 완료 (오차범위: 약 ${acc}m)`;
          getAddress(currentLng, currentLat);
        },
        (err) => {
          statusEl.innerText = "❌ GPS 수신 실패. 위치 권한을 허용해주세요.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function getAddress(lng, lat) {
      const script = document.createElement('script');
      const callbackName = 'vworldCallback_' + Math.floor(Math.random() * 100000);
      
      window[callbackName] = function(data) {
        if (data.response && data.response.status === "OK") {
          const result = data.response.result[0];
          currentAddress = result.text;
        } else {
          currentAddress = "주소 변환 실패 (좌표만 기록됨)";
        }
        document.getElementById('status').innerText += `\n📍 ${currentAddress}`;
        delete window[callbackName];
        document.body.removeChild(script);
      };

      script.src = `https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point=${lng},${lat}&format=json&type=both&zipcode=false&simple=false&key=${VWORLD_KEY}&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    function getFormattedDate() {
      const now = new Date();
      const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      const pad = (n) => n.toString().padStart(2, '0');
      return `${now.getFullYear()}년${pad(now.getMonth()+1)}월${pad(now.getDate())}일 ${pad(now.getHours())}:${pad(now.getMinutes())} ${days[now.getDay()]}`;
    }

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      let lines = [];
      let currentLine = words[0] || '';

      for (let i = 1; i < words.length; i++) {
        let testLine = currentLine + " " + words[i];
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth) {
          lines.push(currentLine);
          currentLine = words[i];
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('canvas');
          const ctx = canvas.getContext('2d');

          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          // 가로 크기를 기존의 약 2/3 수준으로 축소 (가로 사진 31%, 세로 사진 46%)
          const isLandscape = canvas.width >= canvas.height;
          const boxWidth = isLandscape ? canvas.width * 0.31 : canvas.width * 0.46;
          const baseSize = isLandscape ? canvas.width : canvas.height;
          
          // 축소된 박스 폭에 맞춰 글자 크기 및 여백 비례 조정
          const fontSize = Math.max(14, Math.floor(baseSize * 0.012));
          const titleFontSize = Math.floor(fontSize * 1.25);
          const paddingX = fontSize * 0.6;
          const paddingY = fontSize * 0.5;
          const col1Width = fontSize * 4.5;
          const col2Width = boxWidth - col1Width - (paddingX * 2);

          const titleText = document.getElementById('titleText').value || '현장 점검 기록';
          
          // 항목 순서: 세부위치 아래에 내용이 오도록 변경
          const rawRows = [
            { label: '시간', value: getFormattedDate() },
            { label: '주소', value: currentAddress },
            { label: '경위도', value: `${currentLat}, ${currentLng}` },
            { label: '세부위치', value: document.getElementById('detailLoc').value || '-' },
            { label: '내용', value: document.getElementById('content').value || '-' },
            { label: '점검자', value: document.getElementById('inspector').value || '-' }
          ];

          ctx.font = `bold ${fontSize}px 'Malgun Gothic', sans-serif`;
          const rows = rawRows.map(r => {
            const wrapped = wrapText(ctx, r.value, col2Width);
            const rowHeight = (wrapped.length * fontSize * 1.35) + (paddingY * 1.35);
            return { label: r.label, lines: wrapped, height: rowHeight };
          });

          const headerHeight = titleFontSize + (paddingY * 1.7);
          const totalRowsHeight = rows.reduce((sum, r) => sum + r.height, 0);
          const boxHeight = headerHeight + totalRowsHeight;

          const startX = canvas.width * 0.015;
          const startY = canvas.height - boxHeight - (canvas.height * 0.015);

          // 반투명 배경
          ctx.fillStyle = "rgba(20, 25, 22, 0.38)";
          ctx.fillRect(startX, startY, boxWidth, boxHeight);

          // 외곽 테두리
          ctx.strokeStyle = "rgba(110, 215, 135, 0.75)";
          ctx.lineWidth = Math.max(1.5, baseSize * 0.0014);
          ctx.strokeRect(startX, startY, boxWidth, boxHeight);

          // 텍스트 그림자
          ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
          ctx.shadowBlur = 3;
          ctx.shadowOffsetX = 1;
          ctx.shadowOffsetY = 1;

          // 상단 제목
          ctx.fillStyle = "#5CE67E";
          ctx.font = `bold ${titleFontSize}px 'Malgun Gothic', sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(titleText, startX + paddingX, startY + (headerHeight / 2));

          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;

          // 내부 선 및 텍스트
          let currentY = startY + headerHeight;
          const dividerX = startX + col1Width;

          ctx.strokeStyle = "rgba(110, 215, 135, 0.5)";
          ctx.lineWidth = Math.max(1, baseSize * 0.0009);
          ctx.beginPath();
          ctx.moveTo(dividerX, currentY);
          ctx.lineTo(dividerX, startY + boxHeight);
          ctx.stroke();

          rows.forEach((row) => {
            ctx.beginPath();
            ctx.moveTo(startX, currentY);
            ctx.lineTo(startX + boxWidth, currentY);
            ctx.stroke();

            ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
            ctx.shadowBlur = 3;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;

            ctx.font = `bold ${fontSize}px 'Malgun Gothic', sans-serif`;
            ctx.textBaseline = "top";
            
            ctx.fillStyle = "#E8F5E9";
            ctx.fillText(row.label, startX + paddingX, currentY + paddingY * 0.7);

            ctx.fillStyle = "#FFFFFF";
            row.lines.forEach((lineText, idx) => {
              ctx.fillText(lineText, dividerX + paddingX, currentY + (paddingY * 0.7) + (idx * fontSize * 1.35));
            });

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            currentY += row.height;
          });

          canvas.style.display = "block";
          document.getElementById('saveBtn').style.display = "block";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadImage() {
      const canvas = document.getElementById('canvas');
      const link = document.createElement('a');
      
      const now = new Date();
      const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
      const loc = document.getElementById('detailLoc').value.trim().replace(/\s+/g, '_') || '현장';
      const content = document.getElementById('content').value.trim().replace(/\s+/g, '_') || '점검';

      link.download = `${dateStr}_${loc}_${content}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
    }
  </script>
</body>
</html>
